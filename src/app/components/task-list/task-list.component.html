<div class="page">
  <header class="page-header">
    <div class="header-title">
      <h1>Task Manager</h1>
      <span class="task-count">{{ tasks().length }} tasks</span>
    </div>
    <button class="btn btn-primary" (click)="goToNew()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Task
    </button>
  </header>

  <div class="task-list">
    @if (isLoading()) {
      <div class="state-message">
        <div class="spinner"></div>
        <p>Loading tasks...</p>
      </div>
    } @else {
      @for (task of pagedTasks(); track task.id) {
        <app-task
          [task]="task"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
        />
      } @empty {
        <div class="state-message">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <p>No tasks yet. Create your first one!</p>
          <button class="btn btn-primary" (click)="goToNew()">Create Task</button>
        </div>
      }

      @if (totalPages() > 1) {
        <div class="pagination">
          <button class="btn btn-secondary" [disabled]="!hasPrev()" (click)="prevPage()">
            ← Previous
          </button>
          <span class="page-info">Page {{ currentPage() + 1 }} of {{ totalPages() }}</span>
          <button class="btn btn-secondary" [disabled]="!hasNext()" (click)="nextPage()">
            Next →
          </button>
        </div>
      }
    }
  </div>
</div>
